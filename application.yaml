apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/RupaEnggVille/guestbook-repo.git
    targetRevision: HEAD
    path: apps

  destination: 
    server: https://kubernetes.default.svc
    namespace: guestbook
  
  syncpolicy:
    automated:
      prune: true